name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" -r infra/requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Agent eval gate (offline agents, every case; fails on any wrong action or unsafe proposal)
        run: python -m opsrelay.cli eval --runs 1 --fail-under 1.0

  image:
    runs-on: ubuntu-24.04-arm  # AgentCore Runtime runs arm64
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opsrelay .
      - name: Smoke test the coordinator contract
        run: |
          docker run -d --name coord -p 8080:8080 opsrelay
          for i in $(seq 30); do curl -sf localhost:8080/ping && break; sleep 1; done
          curl -sf localhost:8080/invocations -H 'content-type: application/json' \
               -d '{"action": "simulate", "scenario": "bad-deploy"}' | grep -q awaiting_approval
